# AlgoAgent 出厂默认配置（选型 3.2 节）
# 优先级：数据库（F12 管理页，本阶段占位）> 环境变量 > 本文件
llm:
  base_url: "http://172.31.2.220:31558/v1"  # 本地 DeepSeek（OpenAI 兼容端点）
  api_key: "${LLM_API_KEY}"                  # 从环境变量注入，禁止明文入库/入仓
  model: "deepseek-v4-flash"
  temperature: 0.3
  max_tokens: 16384     # 首轮实测 8192 出现 1 次截断，上调防长 HTML 生成截断
  timeout: 600          # 单次请求超时（秒）：长 HTML 生成在本地推理端点上可达数分钟
  capabilities:
    vision: false        # 按模型实际情况配置
    streaming: true
