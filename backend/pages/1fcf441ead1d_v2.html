<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dijkstra 教学 · 松弛操作可视化</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, 'Segoe UI', Roboto, sans-serif; }
        body { margin: 0; background: #f4f7fb; display: flex; justify-content: center; padding: 20px; }
        .container { max-width: 1100px; width: 100%; background: white; border-radius: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); padding: 24px 28px; }
        h1 { font-size: 1.8rem; margin: 0 0 4px; color: #1e2b3c; font-weight: 600; }
        .subtitle { color: #3a5f7a; margin-bottom: 20px; font-size: 1rem; border-left: 4px solid #2c7da0; padding-left: 12px; }
        .control-bar { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; background: #eef3f8; padding: 12px 16px; border-radius: 40px; margin-bottom: 24px; }
        .control-bar button { background: white; border: 1px solid #b0c8da; border-radius: 30px; padding: 8px 18px; font-size: 0.95rem; font-weight: 500; cursor: pointer; transition: all 0.1s; }
        .control-bar button:hover { background: #d4e3f0; border-color: #2c7da0; }
        .control-bar button:active { background: #b8d1e5; }
        .control-bar input { width: 70px; padding: 6px 8px; border-radius: 30px; border: 1px solid #b0c8da; text-align: center; font-weight: 500; }
        .control-bar label { font-weight: 500; color: #1e3b4f; }
        .graph-area { background: #f9fcff; border: 2px solid #d7e3ec; border-radius: 24px; padding: 20px 10px; margin-bottom: 20px; display: flex; justify-content: center; }
        #graphCanvas { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px 30px; max-width: 100%; }
        .node-card { background: white; border-radius: 16px; padding: 10px 12px 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 2px solid #cbdae6; min-width: 100px; text-align: center; transition: all 0.15s; }
        .node-card.highlight { border-color: #f4a261; background: #fff4e6; box-shadow: 0 0 0 3px #f4a26155; }
        .node-card.finalized { border-color: #2a9d8f; background: #e8f8f5; }
        .node-name { font-weight: 700; font-size: 1.2rem; color: #1e3b4f; }
        .dist-badge { background: #e0e9f2; border-radius: 30px; padding: 4px 10px; font-size: 1.1rem; font-weight: 600; margin: 8px 0 6px; display: inline-block; }
        .edge-list { font-size: 0.8rem; color: #3a5f7a; background: #f0f5fa; border-radius: 30px; padding: 4px 8px; margin-top: 6px; }
        .explain-box { background: #f0f6fd; border-left: 6px solid #2c7da0; padding: 14px 18px; border-radius: 12px; margin: 18px 0 16px; font-size: 1rem; }
        .explain-box strong { color: #1e3b4c; }
        .step-controls { display: flex; gap: 12px; justify-content: center; margin: 12px 0 8px; }
        .step-controls button { background: white; border: 1px solid #2c7da0; border-radius: 30px; padding: 8px 22px; font-weight: 600; color: #1e3b4c; cursor: pointer; }
        .step-controls button:hover { background: #d4e3f0; }
        .footer-note { color: #5f7d99; font-size: 0.85rem; text-align: right; margin-top: 12px; border-top: 1px solid #d0dce8; padding-top: 12px; }
        .verify-badge { background: #e1ecf4; padding: 4px 12px; border-radius: 30px; font-size: 0.8rem; }
    </style>
</head>
<body>
<div class="container">
    <h1>📘 Dijkstra 松弛操作</h1>
    <div class="subtitle">单源最短路径 · 逐步松弛 (relaxation)</div>

    <!-- 参数区 -->
    <div class="control-bar">
        <label>节点数: <input id="nodeCount" type="number" min="3" max="7" value="5"></label>
        <button id="btn-reset">⟳ 重新生成图</button>
        <span style="flex:1"></span>
        <span class="verify-badge">⚡ 自检: window.__verify__</span>
    </div>

    <!-- 可视化主体 -->
    <div class="graph-area">
        <div id="graphCanvas"></div>
    </div>

    <!-- 讲解区 -->
    <div class="explain-box" id="explainText">
        <strong>初始化</strong> 距离数组 dist[] = ∞，源点 dist[0]=0。点击“单步执行”开始松弛。
    </div>

    <!-- 单步控件 -->
    <div class="step-controls">
        <button id="btn-prev">◀ 上一步</button>
        <button id="btn-step">▶ 单步执行</button>
        <button id="btn-next">下一步 ▶</button>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 0.9rem; color: #2c3e50; margin-top: 6px;">
        <span>步骤 <span id="stepIdx">0</span> / <span id="stepTotal">0</span></span>
        <span>松弛操作: 更新更短距离</span>
    </div>
    <div class="footer-note">Dijkstra · 教学可视化 — 松弛操作 (dist[v] > dist[u] + w)</div>
</div>

<script>
(function() {
    // ---------- 核心算法 (纯函数, 暴露到 window) ----------
    function dijkstraCore(adjMatrix, source = 0) {
        const n = adjMatrix.length;
        const dist = new Array(n).fill(Infinity);
        const visited = new Array(n).false;
        dist[source] = 0;
        for (let i = 0; i < n; i++) {
            let u = -1;
            for (let j = 0; j < n; j++) {
                if (!visited[j] && (u === -1 || dist[j] < dist[u])) u = j;
            }
            if (dist[u] === Infinity) break;
            visited[u] = true;
            for (let v = 0; v < n; v++) {
                if (adjMatrix[u][v] > 0 && !visited[v]) {
                    const newDist = dist[u] + adjMatrix[u][v];
                    if (newDist < dist[v]) dist[v] = newDist;  // 松弛
                }
            }
        }
        // 不可达节点返回 null (符合规范)
        return dist.map(d => (d === Infinity ? null : d));
    }

    // ---------- 测试用例 (E2) ----------
    const adj1 = [
        [0, 4, 2, 0, 0],
        [4, 0, 1, 5, 0],
        [2, 1, 0, 8, 10],
        [0, 5, 8, 0, 2],
        [0, 0, 10, 2, 0]
    ];
    const adj2 = [
        [0, 7, 0, 2],
        [7, 0, 1, 0],
        [0, 1, 0, 4],
        [2, 0, 4, 0]
    ];
    const adj3 = [ [0] ];  // 单节点
    const expected1 = [0, 3, 2, 8, 10];   // 手推: 0->2(2), 0->2->1(3), 0->2->3(10? 实际0->2->1->3=3+5=8), 0->2->4(12? 0->2->1->3->4=8+2=10)
    const expected2 = [0, 7, 8, 2];       // 0->3(2), 0->3->2(6? 但0->1=7, 0->3->2=2+4=6, 0->3->2->1=6+1=7) 实际dist[1]=7, dist[2]=6
    const expected3 = [0];

    window.__TEST_CASES__ = [
        { input: adj1, expected: expected1 },
        { input: adj2, expected: [0, 7, 6, 2] },  // 修正: 0->3(2), 0->3->2(2+4=6), 0->3->2->1(6+1=7)
        { input: adj3, expected: [0] }
    ];

    // 修正 expected2: 重新手推 adj2: 0->3=2, 0->3->2=6, 0->3->2->1=7, 所以 [0,7,6,2]
    window.__TEST_CASES__[1].expected = [0, 7, 6, 2];

    window.__verify__ = function(input) {
        return dijkstraCore(input, 0);
    };

    // ---------- 可视化状态 ----------
    let graph = [];          // 邻接矩阵
    let nodeCount = 5;
    let steps = [];          // 每一步的快照数据
    let currentStep = -1;

    // DOM 元素
    const canvas = document.getElementById('graphCanvas');
    const explainDiv = document.getElementById('explainText');
    const stepIdxSpan = document.getElementById('stepIdx');
    const stepTotalSpan = document.getElementById('stepTotal');
    const btnPrev = document.getElementById('btn-prev');
    const btnStep = document.getElementById('btn-step');
    const btnNext = document.getElementById('btn-next');
    const btnReset = document.getElementById('btn-reset');
    const nodeCountInput = document.getElementById('nodeCount');

    // ---------- 生成随机图 (保证连通, 权重1-9) ----------
    function generateGraph(n) {
        const matrix = Array.from({ length: n }, () => new Array(n).fill(0));
        // 确保连通: 链式连接
        for (let i = 0; i < n - 1; i++) {
            const w = Math.floor(Math.random() * 8) + 2;
            matrix[i][i+1] = w;
            matrix[i+1][i] = w;
        }
        // 随机额外边
        for (let i = 0; i < n; i++) {
            for (let j = i+2; j < n; j++) {
                if (Math.random() < 0.35) {
                    const w = Math.floor(Math.random() * 9) + 1;
                    matrix[i][j] = w;
                    matrix[j][i] = w;
                }
            }
        }
        return matrix;
    }

    // 生成步骤快照 (基于Dijkstra执行过程)
    function buildSteps(adjMatrix) {
        const n = adjMatrix.length;
        const dist = new Array(n).fill(Infinity);
        const visited = new Array(n).fill(false);
        const parent = new Array(n).fill(-1);
        dist[0] = 0;
        const stepList = [];
        stepList.push({
            dist: [...dist],
            visited: [...visited],
            highlight: [],
            relaxEdge: null,
            text: `初始化: 源点0距离=0, 其余∞`
        });

        for (let iter = 0; iter < n; iter++) {
            let u = -1;
            for (let i = 0; i < n; i++) {
                if (!visited[i] && (u === -1 || dist[i] < dist[u])) u = i;
            }
            if (u === -1 || dist[u] === Infinity) break;
            visited[u] = true;
            // 记录选中节点
            stepList.push({
                dist: [...dist],
                visited: [...visited],
                highlight: [u],
                relaxEdge: null,
                text: `选择未访问中距离最小的节点 ${u} (dist=${dist[u]}), 标记为已确定`
            });
            // 松弛邻接
            for (let v = 0; v < n; v++) {
                if (adjMatrix[u][v] > 0 && !visited[v]) {
                    const newDist = dist[u] + adjMatrix[u][v];
                    if (newDist < dist[v]) {
                        const oldDist = dist[v];
                        dist[v] = newDist;
                        stepList.push({
                            dist: [...dist],
                            visited: [...visited],
                            highlight: [u, v],
                            relaxEdge: [u, v],
                            text: `松弛: 节点${v} 旧距离${oldDist===Infinity?'∞':oldDist} > ${dist[u]}+${adjMatrix[u][v]}=${newDist}, 更新为${newDist}`
                        });
                    }
                }
            }
        }
        // 最后一步
        stepList.push({
            dist: [...dist],
            visited: [...visited],
            highlight: [],
            relaxEdge: null,
            text: `算法完成, 最终距离: [${dist.map(d=>d===Infinity?'∞':d).join(', ')}]`
        });
        return stepList;
    }

    // 渲染图 + 当前步骤
    function render() {
        const n = graph.length;
        if (n === 0) return;
        const stepData = steps[currentStep] || steps[0];
        const dist = stepData.dist;
        const visited = stepData.visited;
        const highlightNodes = stepData.highlight || [];
        const relaxEdge = stepData.relaxEdge;

        let html = '';
        for (let i = 0; i < n; i++) {
            const distVal = dist[i] === Infinity ? '∞' : dist[i];
            const isHighlight = highlightNodes.includes(i);
            const isFinal = visited[i];
            const nodeClass = `node-card ${isHighlight ? 'highlight' : ''} ${isFinal ? 'finalized' : ''}`;
            // 收集边信息 (显示权重)
            let edgeStr = '';
            for (let j = 0; j < n; j++) {
                if (graph[i][j] > 0 && j > i) {
                    edgeStr += `${i}↔${j}:${graph[i][j]} `;
                }
            }
            html += `<div class="${nodeClass}">
                <div class="node-name">V${i}</div>
                <div class="dist-badge">${distVal}</div>
                <div class="edge-list">${edgeStr || '无'}</div>
                ${isFinal ? '✓' : ''}
            </div>`;
        }
        canvas.innerHTML = html;

        // 讲解
        explainDiv.innerHTML = `<strong>步骤 ${currentStep+1}/${steps.length}:</strong> ${stepData.text}`;
        stepIdxSpan.textContent = currentStep + 1;
        stepTotalSpan.textContent = steps.length;
    }

    // 重置并生成新图
    function resetGraph() {
        let n = parseInt(nodeCountInput.value, 10);
        if (isNaN(n) || n < 3) n = 3;
        if (n > 7) n = 7;
        nodeCountInput.value = n;
        graph = generateGraph(n);
        steps = buildSteps(graph);
        currentStep = 0;
        render();
    }

    // 事件绑定
    btnReset.addEventListener('click', resetGraphhed);
    function resetGraphhed() { resetGraph(); }

    btnStep.addEventListener('click', () => {
        if (currentStep < steps.length - 1) {
            currentStep++;
            render();
        }
    });
    btnNext.addEventListener('click', () => {
        if (currentStep < steps.length - 1) {
            currentStep++;
            render();
        }
    });
    btnPrev.addEventListener('click', () => {
        if (currentStep > 0) {
            currentStep--;
            render();
        }
    });

    // 初始化
    resetGraph();

    // 额外: 输入变化重置
    nodeCountInput.addEventListener('change', resetGraphhedapse);
    function resetGraphhedapse() { resetGraph(); }

    // 确保自检函数暴露
    window.__verify__ = dijkstraCore;
    // 重新定义测试用例 (确保一致性)
    window.__TEST_CASES__ = [
        { input: adj1, expected: [0, 3, 2, 8, 10] },
        { input: adj2, expected: [0, 7, 6, 2] },
        { input: adj3, expected: [0] }
    ];
})();
</script>
</body>
</html>
